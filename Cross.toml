[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update -qq",
    "apt-get install -y --no-install-recommends python3 autoconf automake libtool pkg-config",
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "apt-get update -qq",
    "apt-get install -y --no-install-recommends python3 autoconf automake libtool pkg-config",
]
